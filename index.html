<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Ксюши ❤️</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(rgba(255, 227, 227, 0.4), rgba(255, 240, 245, 0.5)), url('photo.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 90%;
            width: 500px;
            z-index: 5;
            margin-top: 10vh;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff4d6d;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
            margin: 0 0 20px 0;
            font-weight: bold;
        }

        .btn {
            background: linear-gradient(45deg, #ff4d6d, #ff85a2);
            color: white;
            border: none;
            padding: 15px 45px;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
            transition: transform 0.2s, background 0.2s;
            margin-bottom: 30px;
            position: relative;
            z-index: 10;
        }

        .btn:hover {
            background: linear-gradient(45deg, #ff758f, #ffb3c1);
            transform: scale(1.05);
        }

        .timer-title {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .timer-item {
            background: #ff4d6d;
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            min-width: 60px;
        }

        .timer-num {
            font-size: 1.5rem;
            font-weight: bold;
            display: block;
        }

        .timer-label {
            font-size: 0.75rem;
            opacity: 0.9;
        }

        /* Постоянный фон из CSS-сердечек */
        .background-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 2;
            pointer-events: none;
        }

        .bg-heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp 6s infinite linear;
            opacity: 0;
        }

        /* Разные дорожки для плавного взлета */
        .bg-heart:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 5s; }
        .bg-heart:nth-child(2) { left: 25%; animation-delay: 1.5s; animation-duration: 7s; }
        .bg-heart:nth-child(3) { left: 45%; animation-delay: 3s; animation-duration: 6s; }
        .bg-heart:nth-child(4) { left: 65%; animation-delay: 0.5s; animation-duration: 8s; }
        .bg-heart:nth-child(5) { left: 85%; animation-delay: 2s; animation-duration: 5.5s; }
        .bg-heart:nth-child(6) { left: 15%; animation-delay: 4s; animation-duration: 6.5s; }
        .bg-heart:nth-child(7) { left: 75%; animation-delay: 5s; animation-duration: 7.5s; }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-105vh) rotate(360deg); opacity: 0; }
        }

        /* Стиль динамических огненных сердечек */
        .fire-heart {
            position: fixed;
            bottom: -50px;
            font-size: 30px;
            z-index: 3;
            pointer-events: none;
            animation: fireFly 4s forwards linear;
        }

        @keyframes fireFly {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) translateX(var(--x)) rotate(var(--r)); opacity: 0; }
        }

        /* Галерея */
        .gallery-section {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 100%;
            max-width: 1100px;
            padding: 40px 20px;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.05);
            z-index: 5;
            box-sizing: border-box;
        }

        .gallery-title {
            font-size: 1.8rem;
            color: #ff4d6d;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .gallery-item {
            background: white;
            padding: 10px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .gallery-item img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- Постоянно летящие фоновые сердечки -->

        <div class="bg-heart">❤️</div>

            <div class="gallery-item"><img src="7.jpg" alt="Фото"></div>

            <div class="gallery-item"><img src="9.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="10.jpg" alt="Фото"></div>

            <div class="gallery-item"><img src="12.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="13.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="14.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="15.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="16.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="17.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="18.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="19.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="20.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="21.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="22.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="23.jpg" alt="Фото"></div>
            <div class="gallery-item"><img src="24.jpg" alt="Фото"></div>
        </div>
    </div>

    <script>
        // Таймер
        const startDate = new Date('2025-01-17T00:00:00');
        function updateTimer() {
            const difference = new Date() - startDate;
            document.getElementById('days').innerText = Math.floor(difference / (1000 * 60 * 60 * 24));
            document.getElementById('hours').innerText = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            document.getElementById('minutes').innerText = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            document.getElementById('seconds').innerText = Math.floor((difference % (1000 * 60)) / 1000);
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // Огненный взрыв по кнопке
        function triggerFire() {
            const icons = ['🔥', '❤️'];
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    const f = document.createElement('div');
                    f.classList.add('fire-heart');
                   function triggerFire() {
    const icons = ['🔥', '❤️'];
    for (let i = 0; i < 30; i++) {
        setTimeout(() => {
            const f = document.createElement('div');
            f.classList.add('fire-heart');
            f.innerHTML = icons[Math.floor(Math.random() * icons.length)];
            f.style.left = Math.random() * 100 + 'vw';
            f.style.setProperty('--x', (Math.random() * 200 - 100) + 'px');
            f.style.setProperty('--r', (Math.random() * 360) + 'deg');
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 4000);
        }, i * 80);
    }
}
